<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة وسيلة - توثيق الأجهزة والمستلزمات</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-emerald-800 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">منصة وسيلة</h1>
            <div id="authContainer">
                <button id="loginBtn" onclick="toggleModal('loginModal', true)" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-medium transition">تسجيل دخول الأدمن</button>
                <button id="logoutBtn" onclick="logout()" class="hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition">تسجيل الخروج</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        
        <!-- Admin Add Equipment Section -->
        <section id="adminAddSection" class="hidden bg-white p-6 rounded-xl shadow-md mb-8 border-t-4 border-emerald-700">
            <h2 class="text-xl font-bold mb-4 text-emerald-900">إضافة جهاز جديد</h2>
            <form id="addEquipmentForm" onsubmit="handleAddEquipment(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1 text-sm font-semibold">اسم الجهاز</label>
                    <input type="text" id="eqName" required class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-emerald-600">
                </div>
                <div>
                    <label class="block mb-1 text-sm font-semibold">المكان / القسم</label>
                    <input type="text" id="eqLocation" required class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-emerald-600">
                </div>
                <div class="md:col-span-2">
                    <label class="block mb-1 text-sm font-semibold">الوصف والتفاصيل</label>
                    <textarea id="eqDescription" rows="3" required class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-emerald-600"></textarea>
                </div>
                <div>
                    <label class="block mb-1 text-sm font-semibold">صورة الغلاف (الخارجية)</label>
                    <input type="file" id="mainImageInput" accept="image/*" required class="w-full border border-gray-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block mb-1 text-sm font-semibold">الصورة التفصيلية (الداخلية)</label>
                    <input type="file" id="detailImageInput" accept="image/*" required class="w-full border border-gray-300 rounded-lg p-2">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="submitBtn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 rounded-lg transition">إضافة الجهاز</button>
                </div>
            </form>
        </section>

        <!-- Equipment Cards List -->
        <section>
            <h2 class="text-2xl font-bold mb-6 text-gray-800">الأجهزة والمستلزمات المسجلة</h2>
            <div id="equipmentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <!-- Modal: Login -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <h3 class="text-xl font-bold mb-4 text-emerald-900">تسجيل الدخول كـ أدمن</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block mb-1 text-sm font-semibold">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required class="w-full border border-gray-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block mb-1 text-sm font-semibold">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full border border-gray-300 rounded-lg p-2">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="toggleModal('loginModal', false)" class="px-4 py-2 border rounded-lg">إلغاء</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-700 text-white rounded-lg">دخول</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: View Details (Shows second image) -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleModal('detailModal', false)" class="absolute top-4 left-4 text-gray-500 hover:text-black font-bold text-xl">&times;</button>
            <h3 id="modalTitle" class="text-2xl font-bold text-emerald-900 mb-2"></h3>
            <p id="modalLocation" class="text-sm text-gray-500 mb-4"></p>
            <div class="mb-4">
                <p class="text-sm font-semibold text-gray-700 mb-1">الصورة التفصيلية:</p>
                <img id="modalImage" src="" alt="صورة التفاصيل" class="w-full h-72 object-cover rounded-lg border">
            </div>
            <p id="modalDescription" class="text-gray-700 leading-relaxed"></p>
        </div>
    </div>

    <script>
        // 1. Supabase Setup
        const SUPABASE_URL = 'https://your-project-id.supabase.co';
        const SUPABASE_ANON_KEY = 'your-anon-key';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // Initialize App
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            currentUser = user;
            updateUI();
            fetchEquipment();
        });

        // UI View Toggle
        function updateUI() {
            const adminSection = document.getElementById('adminAddSection');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            if (currentUser) {
                adminSection.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                adminSection.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }
        }

        // Toggle Modals
        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        // Auth: Login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('خطأ في تسجيل الدخول: ' + error.message);
            } else {
                currentUser = data.user;
                toggleModal('loginModal', false);
                updateUI();
                fetchEquipment();
            }
        }

        // Auth: Logout
        async function logout() {
            await supabase.auth.signOut();
            currentUser = null;
            updateUI();
            fetchEquipment();
        }

        // Add Equipment with Two Images
        async function handleAddEquipment(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'جاري الرفع والإضافة...';
            btn.disabled = true;

            try {
                const name = document.getElementById('eqName').value;
                const location = document.getElementById('eqLocation').value;
                const description = document.getElementById('eqDescription').value;

                const mainFile = document.getElementById('mainImageInput').files[0];
                const detailFile = document.getElementById('detailImageInput').files[0];

                // Upload Main Image
                const mainPath = `main_${Date.now()}_${mainFile.name}`;
                await supabase.storage.from('waseela-images').upload(mainPath, mainFile);
                const mainUrl = supabase.storage.from('waseela-images').getPublicUrl(mainPath).data.publicUrl;

                // Upload Detail Image
                const detailPath = `detail_${Date.now()}_${detailFile.name}`;
                await supabase.storage.from('waseela-images').upload(detailPath, detailFile);
                const detailUrl = supabase.storage.from('waseela-images').getPublicUrl(detailPath).data.publicUrl;

                // Insert into Database
                const { error } = await supabase.from('equipment').insert([
                    {
                        name: name,
                        location: location,
                        description: description,
                        main_image_url: mainUrl,
                        detail_image_url: detailUrl
                    }
                ]);

                if (error) throw error;

                document.getElementById('addEquipmentForm').reset();
                alert('تمت إضافة الجهاز بنجاح!');
                fetchEquipment();
            } catch (err) {
                alert('حدث خطأ أثناء الإضافة: ' + err.message);
            } finally {
                btn.innerText = 'إضافة الجهاز';
                btn.disabled = false;
            }
        }

        // Fetch Equipment and Render Cards
        async function fetchEquipment() {
            const grid = document.getElementById('equipmentGrid');
            grid.innerHTML = '<p class="text-gray-500">جاري تحميل البيانات...</p>';

            const { data, error } = await supabase.from('equipment').select('*').order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = '<p class="text-red-500">فشل تحميل البيانات.</p>';
                return;
            }

            if (data.length === 0) {
                grid.innerHTML = '<p class="text-gray-500">لا يوجد أجهزة مسجلة حالياً.</p>';
                return;
            }

            grid.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition cursor-pointer flex flex-col justify-between';
                
                card.innerHTML = `
                    <div onclick="openDetailModal('${escapeHtml(item.name)}', '${escapeHtml(item.location)}', '${escapeHtml(item.description)}', '${item.detail_image_url}')">
                        <img src="${item.main_image_url}" alt="${item.name}" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <h3 class="font-bold text-lg text-emerald-900 mb-1">${item.name}</h3>
                            <p class="text-sm text-gray-500 mb-2">📍 ${item.location}</p>
                            <p class="text-gray-600 text-sm line-clamp-2">${item.description}</p>
                        </div>
                    </div>
                    ${currentUser ? `
                        <div class="p-4 border-t bg-gray-50 text-left">
                            <button onclick="deleteEquipment(${item.id})" class="text-red-600 hover:text-red-800 text-sm font-semibold">حذف</button>
                        </div>
                    ` : ''}
                `;
                grid.appendChild(card);
            });
        }

        // Open Detail Modal
        function openDetailModal(name, location, description, detailImageUrl) {
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalLocation').innerText = '📍 ' + location;
            document.getElementById('modalDescription').innerText = description;
            document.getElementById('modalImage').src = detailImageUrl;
            toggleModal('detailModal', true);
        }

        // Delete Equipment
        async function deleteEquipment(id) {
            if (!confirm('هل أنت تأكد من حذف هذا الجهاز؟')) return;
            const { error } = await supabase.from('equipment').delete().eq('id', id);
            if (error) alert('حدث خطأ أثناء الحذف');
            else fetchEquipment();
        }

        // Utility to prevent XSS
        function escapeHtml(str) {
            return str ? str.replace(/'/g, "\\'") : '';
        }
    </script>
</body>
</html>
